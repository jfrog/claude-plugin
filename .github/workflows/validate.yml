name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Catches a malformed version in review, where it is cheap to fix. The release workflow
      # compares it against the latest tag; that comparison only makes sense on main.
      - name: Check the manifest version is X.Y.Z
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' .claude-plugin/plugin.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.claude-plugin/plugin.json version '$VERSION' is not X.Y.Z"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate plugin layout
        run: node scripts/validate-claude-plugin.mjs

      # The Claude plugin directory's own checks (a subset of what it runs on submission).
      # Pinned so a new CLI release can't turn CI red without a change here; bump it deliberately.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: Validate against the plugin directory checks
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin validate --profile directory --strict .

      - name: Run plugin directory check unit tests
        run: node --test scripts/plugin-directory-checks.test.mjs

      - name: Run MCP rewrite hook unit tests
        run: node --test scripts/claude-mcp-json-discover.test.mjs scripts/claude-align-mcp-json.test.mjs

      - name: Validate the skill-enforcement hook
        run: node scripts/validate-enforce-hook.mjs
