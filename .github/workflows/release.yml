name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository with full history for tag inspection
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Inspect the commit message for a [major], [minor], or [patch] release tag
      - name: Detect release tag in commit message
        id: detect
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qE '\[(major|minor|patch)\]'; then
            TAG=$(echo "$MSG" | grep -oE '\[(major|minor|patch)\]' | head -1 | tr -d '[]')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      # Calculate the next semantic version based on the detected release tag
      - name: Compute next version
        if: steps.detect.outputs.triggered == 'true'
        id: version
        run: |
          VERSION=$(cat VERSION)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "${{ steps.detect.outputs.tag }}" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      # Write the new version into VERSION and .claude-plugin/plugin.json
      - name: Update VERSION and JSON files
        if: steps.detect.outputs.triggered == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "$VERSION" > VERSION
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json

      # Commit the version bump, create a git tag, and push both to origin
      - name: Commit, tag, and push
        if: steps.detect.outputs.triggered == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION .claude-plugin/plugin.json
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin main
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # Zip the repository contents into a release artifact
      - name: Package release artifact
        if: steps.detect.outputs.triggered == 'true'
        run: zip -r release.zip . --exclude ".git/*" --exclude ".github/*"

      # Publish a GitHub Release with the packaged artifact and auto-generated notes
      - name: Create GitHub Release
        if: steps.detect.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            release.zip \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
