name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history so the "already released" check below can see existing tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Releasing is opt-in: only a merge whose commit message carries [major], [minor] or
      # [patch] cuts one. The marker is purely a trigger — the version itself always comes from
      # the manifest, so the bump is reviewable in the PR that makes it.
      # The message is passed through env rather than interpolated into the script, so a commit
      # subject can never inject shell.
      - name: Detect release marker in commit message
        id: detect
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -qE '\[(major|minor|patch)\]'; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      # .claude-plugin/plugin.json is the single source of truth for the version — it is the file
      # Claude Code itself reads. Nothing duplicates it, so there is no drift to police.
      - name: Read version from the plugin manifest
        if: steps.detect.outputs.triggered == 'true'
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' .claude-plugin/plugin.json)
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.claude-plugin/plugin.json version '$VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Catches the one mistake this flow allows: merging a release marker without bumping the
      # manifest, which would otherwise try to re-tag a version that already shipped.
      - name: Refuse to re-release an existing version
        if: steps.detect.outputs.triggered == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists — bump .claude-plugin/plugin.json before merging a release marker"
            exit 1
          fi

      - name: Create and push tag
        if: steps.detect.outputs.triggered == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package release artifact
        if: steps.detect.outputs.triggered == 'true'
        run: zip -r release.zip . --exclude ".git/*" --exclude ".github/*"

      - name: Create GitHub Release
        if: steps.detect.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            release.zip \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
